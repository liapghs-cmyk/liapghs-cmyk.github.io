<!doctype html>

<meta charset="utf-8">

<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: an Instagram-style feed. Story rail on top, then six chapters (near Adonts → countryside), each a grid of post cards that open the place's account. */
:root{
  --bg:#F1EAE7;
  --surface:#FBF7F5;
  --ink:#24161D;
  --muted:#76626B;
  --line:#DCCFCB;
  --apricot:#E07A2F;
  --pom:#A3243B;
  --t-home:#E8C6CF;
  --t-breakfast:#F3C9A0;
  --t-coffee:#D9C3AE;
  --t-lunch:#C9D8B6;
  --t-dinner:#3B2230;
  --t-country:#BFD3D6;
  --t-ink-dark:#2A1A22;
  --t-ink-light:#F7EDE8;
  --display:"Prata", Georgia, "Times New Roman", serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arm:"Noto Serif Armenian", "Prata", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181115; --surface:#221920; --ink:#F3E9EB; --muted:#B39FA8; --line:#3A2C34;
    --apricot:#F29A55; --pom:#E0566B;
    --t-home:#4A2A35; --t-breakfast:#5A3A22; --t-coffee:#43342A; --t-lunch:#33402B; --t-dinner:#4A2738; --t-country:#264046;
    --t-ink-dark:#F7EDE8; --t-ink-light:#F7EDE8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181115; --surface:#221920; --ink:#F3E9EB; --muted:#B39FA8; --line:#3A2C34;
  --apricot:#F29A55; --pom:#E0566B;
  --t-home:#4A2A35; --t-breakfast:#5A3A22; --t-coffee:#43342A; --t-lunch:#33402B; --t-dinner:#4A2738; --t-country:#264046;
  --t-ink-dark:#F7EDE8; --t-ink-light:#F7EDE8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 56px}
a{color:inherit}
a:focus-visible{outline:2px solid var(--apricot);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto}

header.masthead{padding-block:36px 8px;display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px, 8vw, 76px);line-height:1;margin:0;text-wrap:balance}
h1 .arm{font-family:var(--arm);font-weight:700;color:var(--apricot);display:block;font-size:.42em;margin-top:10px;letter-spacing:.02em}
.lede{max-width:58ch;color:var(--muted);margin:4px 0 0}

.rail-box{margin-block:18px 6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail-box::-webkit-scrollbar{display:none}
.rail{display:flex;gap:16px;padding:6px 2px 10px;width:max-content}
.story{display:grid;justify-items:center;gap:6px;text-decoration:none;width:74px}
.ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(from 210deg, var(--apricot), var(--pom), var(--apricot));transition:transform .2s ease}
.story:hover .ring{transform:scale(1.05)}
.ring > span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:3px solid var(--bg);font-family:var(--display);font-size:24px}
.story small{font-size:11px;color:var(--muted);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

nav.chapters{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);display:flex;gap:8px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
nav.chapters a{text-decoration:none;font-weight:600;font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.chapters a:hover{border-color:var(--apricot);color:var(--apricot)}

section.chapter{padding-top:44px;scroll-margin-top:110px}
.chapter-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(28px, 4.5vw, 40px);margin:0;line-height:1.1}
h2 .arm{font-family:var(--arm);font-size:.55em;color:var(--muted);margin-left:10px;font-weight:500}
.chapter-head p{margin:0;color:var(--muted);font-size:14px;max-width:44ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 260px), 1fr));gap:20px}

.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;min-width:0;transition:transform .2s ease, box-shadow .2s ease}
a.post:hover{transform:translateY(-3px);box-shadow:0 10px 28px -14px rgba(36,22,29,.35)}
.post-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;padding:2px;background:conic-gradient(from 210deg, var(--apricot), var(--pom), var(--apricot))}
.avatar span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:2px solid var(--surface);font-family:var(--display);font-size:14px}
.who{min-width:0;display:grid;line-height:1.25}
.who b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.who small{font-size:12px;color:var(--muted)}
.tile{aspect-ratio:1/1;max-width:100%;display:grid;align-content:space-between;padding:20px}
.tile .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.75}
.tile .big{font-family:var(--display);font-size:clamp(30px, 5vw, 40px);line-height:1.05;text-wrap:balance;overflow-wrap:anywhere}
.tile .where{font-size:13px;font-weight:500;opacity:.85}
.t-home{background:var(--t-home);color:var(--t-ink-dark)}
.t-breakfast{background:var(--t-breakfast);color:var(--t-ink-dark)}
.t-coffee{background:var(--t-coffee);color:var(--t-ink-dark)}
.t-lunch{background:var(--t-lunch);color:var(--t-ink-dark)}
.t-dinner{background:var(--t-dinner);color:var(--t-ink-light)}
.t-country{background:var(--t-country);color:var(--t-ink-dark)}
.caption{padding:14px 16px 6px;font-size:14px;display:grid;gap:6px}
.caption p{margin:0}
.says{font-family:var(--display);font-size:15px;line-height:1.45}
.says{border-left:2px solid var(--apricot);padding-left:10px}
.fact{color:var(--muted);font-size:13px}
.open{margin-top:auto;padding:12px 16px 16px;font-weight:600;font-size:14px;color:var(--pom);display:flex;align-items:center;gap:6px}
a.post:hover .open{color:var(--apricot)}
.open.none{color:var(--muted);font-weight:500}
.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--apricot);color:var(--apricot);margin-left:6px;vertical-align:2px}

footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;max-width:70ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.masthead{grid-template-columns:1fr auto;align-items:end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;gap:2px;align-self:center}
.lang button{font:600 13px/1 var(--body);letter-spacing:.06em;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--apricot);outline-offset:2px}

@media (max-width: 640px){
  .grid{grid-template-columns:repeat(2, minmax(0,1fr));gap:10px}
  .post{border-radius:12px}
  .post-top{padding:8px 10px;gap:6px}
  .avatar{width:24px;height:24px}
  .avatar span{font-size:11px;border-width:1.5px}
  .who b{font-size:11px;line-height:1.2}
  .who small{display:none}
  .chip{font-size:8px;padding:1px 5px;margin-left:4px}
  .tile{aspect-ratio:1/1;padding:10px}
  .tile .kicker{font-size:9px;letter-spacing:.1em}
  .tile .big{font-size:20px}
  .tile .where{font-size:11px}
  .caption{padding:8px 10px 2px;font-size:12px;gap:4px}
  .says{font-size:12.5px;line-height:1.35;padding-left:7px}
  .fact{font-size:11.5px;line-height:1.4}
  .open{padding:8px 10px 10px;font-size:12px}
  section.chapter{padding-top:32px}
  .chapter-head{margin-bottom:12px}
}
</style>
</head>

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const rail = document.getElementById("rail");
const feed = document.getElementById("feed");
const nav = document.getElementById("nav");

function render(lang){
  const T = UI[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  document.getElementById("h1").textContent = T.title;
  document.getElementById("foot").textContent = T.footer;
  document.querySelector(".rail-box").setAttribute("aria-label", T.stories);
  nav.setAttribute("aria-label", T.sections);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));

  let railHTML = "", feedHTML = "", navHTML = "";
  const seen = new Set();
  chapters.forEach(c => {
    const title = lang === "en" ? EN_CH[c.id][0] : c.title;
    const blurb = lang === "en" ? EN_CH[c.id][1] : c.blurb;
    navHTML += `<a href="#${c.id}">${esc(title)}</a>`;
    let cards = "";
    c.places.forEach(p0 => {
      const tr = lang === "en" ? (EN[c.id + ":" + p0.name] || {}) : {};
      const p = Object.assign({}, p0, tr);
      const L = p0.link;
      const kind = L && L.kind === "Maps" ? T.maps : (L ? L.kind : "");
      const label = L ? (L.kind === "Maps" ? (L.mapName ? L.mapName + " · " + T.map : p.name + " · " + T.map) : L.label) : p.name;
      const initial = esc(p.name.replace(/^the\s+/i,"").charAt(0).toUpperCase());
      if (!seen.has(p0.name)) {
        seen.add(p0.name);
        const tag = L ? `a href="${L.href}" target="_blank" rel="noopener"` : `div`;
        railHTML += `<${tag} class="story" title="${esc(p.name)}"><span class="ring"><span class="${c.tone}">${initial}</span></span><small>${esc(p.name)}</small></${L ? "a" : "div"}>`;
      }
      const open = L ? `<span class="open">${T.open} ${kind} <span aria-hidden="true">↗</span></span>`
                     : `<span class="open none">${T.soon}</span>`;
      const inner = `
        <div class="post-top">
          <span class="avatar"><span class="${c.tone}">${initial}</span></span>
          <span class="who"><b>${esc(label)}${p.added ? `<span class="chip">${T.added}</span>` : ''}</b><small>${esc(p.where)}</small></span>
        </div>
        <div class="tile ${c.tone}">
          <div class="kicker">${esc(p.kicker)}</div>
          <div class="big">${esc(p.name)}${p.arm ? `<div lang="hy" style="font-family:var(--arm);font-size:.5em;margin-top:6px">${p.arm}</div>` : ""}</div>
          <div class="where">${esc(p.where)}</div>
        </div>
        <div class="caption">
          ${p.says ? `<p class="says">${esc(p.says)}</p>` : ""}
          ${p.fact ? `<p class="fact">${esc(p.fact)}</p>` : ""}
        </div>
        ${open}`;
      cards += L ? `<a class="post" href="${L.href}" target="_blank" rel="noopener">${inner}</a>` : `<div class="post">${inner}</div>`;
    });
    feedHTML += `<section class="chapter" id="${c.id}">
      <div class="chapter-head"><h2>${esc(title)}<span class="arm" lang="hy">${c.arm}</span></h2><p>${esc(blurb)}</p></div>
      <div class="grid">${cards}</div></section>`;
  });
  rail.innerHTML = railHTML;
  feed.innerHTML = feedHTML;
  nav.innerHTML = navHTML;
}

let lang = "ru";
try { const s = localStorage.getItem("guide-lang"); if (s === "en" || s === "ru") lang = s; } catch(e) {}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("guide-lang", lang); } catch(e) {}
  render(lang);
}));
render(lang);
if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
